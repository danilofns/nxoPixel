name: nxoPixel
version: '${version}'

main: org.nxo.nxoPixel.nxoPixel.NxoPixel
api-version: '1.21'
load: POSTWORLD
commands:
  sethome:
    description: Define uma home.
    usage: /sethome <nome>
  home:
    description:  Vaí até um home setada.
    usage: /home <nome>
  homes:
    description:  Mostra todas suas homes.
    usage: /homes
  deletehome:
    description:  Deleta uma home.
    usage: /deletehome <nome da home>
  renamehome:
    description:  Renomeia uma home.
    usage: /renamehome <nome da home> <novo nome>
  tpa:
    description:  Teleport até um jogador.
    usage: /tpa <nome do jogador>
  tpaccept:
    description: Aceita o teleport do jogador.
    usage: /tpaccept <nome do jogador>
  tpalist:
    description: Verifica a lista de teleport enviado.
    usage: /tpalist
  tag:
    description: Escolha, crie ou remova uma tag.
    usage: /tag <nome da tag>|| /tag criar <nome da tag> <prefixo da tag> || /tag remover <nome da tag>
  tags:
    description: Liste as tags.
    usage: /tags